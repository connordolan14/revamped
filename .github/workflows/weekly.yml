name: League data refresh

# Runs daily so roster moves and the transactions feed stay current. Tuesday
# runs additionally render and email the weekly write-up. Also runnable on
# demand from the Actions tab.
#
# GitHub starts scheduled runs late under load (3.5–8.5 hours late through
# Sept/Oct 2026) and the delay can't be configured away. So Tuesday has several
# staggered attempts instead of one: whichever starts first after 08:30 UTC
# (4:30 AM EDT / 3:30 AM EST, once Sleeper's overnight stat updates are in)
# sends the email, one that starts a bit early waits for that time, and
# data/email-sent.json stops the later attempts from sending it again. With the
# delays seen so far, one attempt lands by ~10:00 UTC (6 AM EDT) at worst.
on:
  schedule:
    - cron: "23 7 * * *"   # every day — refresh data + redeploy
    - cron: "17 1 * * 2"   # Tuesday email attempts (see above)
    - cron: "17 3 * * 2"
    - cron: "17 5 * * 2"
    - cron: "17 7 * * 2"
    - cron: "17 9 * * 2"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Also render + email the weekly write-up (sends even if this week's already went out)"
        type: boolean
        default: false
      force_deploy:
        description: "Fire the Vercel deploy hook even if the data didn't change"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: league-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LEAGUE_ID: ${{ vars.LEAGUE_ID || '1312251123628789760' }}
    steps:
      # Runs wait on each other (concurrency group), so check out the branch
      # head at start rather than the possibly hours-old commit the scheduled
      # event was created against.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Decide whether this run sends the weekly email
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE_EMAIL: ${{ inputs.send_email }}
        run: |
          send=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$FORCE_EMAIL" = "true" ] && send=true
          elif [[ "$SCHEDULE" == *" * * 2" ]]; then
            # Not before 08:30 UTC on Tuesday. Starting up to 4h early: wait.
            if [ "$(date -u +%u)" = "2" ]; then
              target=$(date -u -d "today 08:30" +%s)
              wait=$(( target - $(date -u +%s) ))
              if [ "$wait" -gt 14400 ]; then
                echo "Too early for the email (${wait}s to 08:30 UTC); a later attempt will send it."
              elif [ "$wait" -gt 0 ]; then
                echo "Waiting ${wait}s until 08:30 UTC before pulling data."
                sleep "$wait"
                git pull --ff-only   # pick up anything pushed (e.g. the recap) while waiting
                send=true
              else
                send=true
              fi
            else
              send=true   # delayed past Tuesday entirely: still send if not sent
            fi
          fi

          state=$(curl -fsS https://api.sleeper.app/v1/state/nfl)
          season=$(jq -r .season <<<"$state")
          week=$(( $(jq -r .week <<<"$state") - 1 ))
          if [ "$send" = "true" ] && [ "$EVENT" != "workflow_dispatch" ] && [ -f data/email-sent.json ] \
             && [ "$(jq -r '"\(.season)-\(.week)"' data/email-sent.json)" = "$season-$week" ]; then
            echo "Week $week email already sent; skipping."
            send=false
          fi
          echo "Send email: $send (season $season, week $week)"
          { echo "send=$send"; echo "season=$season"; echo "week=$week"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build league data from Sleeper + FantasyCalc
        run: npm run build:live
        env:
          # Stable between runs (repo push time) so an unchanged data pull
          # doesn't create a spurious daily commit + deploy.
          GEN_TS: ${{ github.event.repository.updated_at }}

      - name: Sanity-check the bundle
        run: |
          node -e '
            const b = require("./web/data/bundle.json");
            const teams = b.teams?.length || 0;
            if (teams < 2) { console.error("bundle has too few teams:", teams); process.exit(1); }
            if (!b.league?.season) { console.error("bundle missing league.season"); process.exit(1); }
            if (!b.seasons || !Object.keys(b.seasons).length) { console.error("bundle has no seasons"); process.exit(1); }
            console.log(`bundle OK - ${teams} teams, season ${b.league.season}, seasons: ${Object.keys(b.seasons).join(", ")}`);
          '

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "league-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/bundle.json data/power-rankings/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "chore: data refresh"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel deploy
        if: steps.commit.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK secret not set - relying on Vercel's Git integration."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null && echo "Vercel deploy hook fired."

      - name: Render standings & power images
        if: steps.gate.outputs.send == 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run render:email

      - name: Email the weekly write-up (skips itself if secrets unset)
        if: steps.gate.outputs.send == 'true'
        run: npm run email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}

      - name: Record that this week's email went out
        if: steps.gate.outputs.send == 'true'
        env:
          SEASON: ${{ steps.gate.outputs.season }}
          WEEK: ${{ steps.gate.outputs.week }}
        run: |
          jq -n --arg s "$SEASON" --argjson w "$WEEK" --arg t "$(date -u +%FT%TZ)" \
            '{season: $s, week: $w, sentAt: $t}' > data/email-sent.json
          git add data/email-sent.json
          git commit -m "chore: record week $WEEK email sent"
          git pull --rebase
          git push
