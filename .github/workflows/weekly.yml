name: League data refresh

# Runs daily at 12:00 UTC (~7–8 AM ET) so roster moves and the transactions
# feed stay current. The Tuesday run additionally renders and emails the weekly
# write-up. Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: "0 12 * * *"   # every day — refresh data + redeploy
    - cron: "0 13 * * 2"   # Tuesday — also send the weekly write-up
  workflow_dispatch:
    inputs:
      send_email:
        description: "Also render + email the weekly write-up"
        type: boolean
        default: false
      force_deploy:
        description: "Fire the Vercel deploy hook even if the data didn't change"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: league-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      LEAGUE_ID: ${{ vars.LEAGUE_ID || '1312251123628789760' }}
      SEND_EMAIL: ${{ github.event.schedule == '0 13 * * 2' || (github.event_name == 'workflow_dispatch' && inputs.send_email) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build league data from Sleeper + FantasyCalc
        run: npm run build:live
        env:
          # Stable between runs (repo push time) so an unchanged data pull
          # doesn't create a spurious daily commit + deploy.
          GEN_TS: ${{ github.event.repository.updated_at }}

      - name: Sanity-check the bundle
        run: |
          node -e '
            const b = require("./web/data/bundle.json");
            const teams = b.teams?.length || 0;
            if (teams < 2) { console.error("bundle has too few teams:", teams); process.exit(1); }
            if (!b.league?.season) { console.error("bundle missing league.season"); process.exit(1); }
            if (!b.seasons || !Object.keys(b.seasons).length) { console.error("bundle has no seasons"); process.exit(1); }
            console.log(`bundle OK - ${teams} teams, season ${b.league.season}, seasons: ${Object.keys(b.seasons).join(", ")}`);
          '

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "league-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/bundle.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "chore: data refresh"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel deploy
        if: steps.commit.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK secret not set - relying on Vercel's Git integration."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null && echo "Vercel deploy hook fired."

      - name: Render standings & power images
        if: env.SEND_EMAIL == 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run render:email

      - name: Email the weekly write-up (skips itself if secrets unset)
        if: env.SEND_EMAIL == 'true'
        run: npm run email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
